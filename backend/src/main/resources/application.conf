kontext {
  atlassian {
    flavor = "cloud"
    flavor = ${?KONTEXT_ATLASSIAN_FLAVOR}
    jira {
      base-url = ""
      base-url = ${?KONTEXT_JIRA_URL}
      projects = ["DEMO"]
      jql-extra = ""
      jql-extra = ${?KONTEXT_JIRA_JQL_EXTRA}
    }
    confluence {
      base-url = ""
      base-url = ${?KONTEXT_CONFLUENCE_URL}
      spaces = ["DEMO"]
    }
    auth {
      email = ""
      email = ${?KONTEXT_ATLASSIAN_EMAIL}
      token = ""
      token = ${?KONTEXT_ATLASSIAN_TOKEN}
    }
    max-concurrency = 4
    max-concurrency = ${?KONTEXT_ATLASSIAN_MAX_CONCURRENCY}
  }
  llm {
    base-url = "http://localhost:1234/v1"
    base-url = ${?KONTEXT_LLM_BASE_URL}
    api-key = ""
    api-key = ${?KONTEXT_LLM_API_KEY}
    chat-model = "gemma-4"
    chat-model = ${?KONTEXT_LLM_CHAT_MODEL}
    embedding-model = "bge-m3"
    embedding-model = ${?KONTEXT_LLM_EMBEDDING_MODEL}
    embedding-dimension = 1024
    embedding-dimension = ${?KONTEXT_LLM_EMBEDDING_DIMENSION}
    temperature = 0.2
    temperature = ${?KONTEXT_LLM_TEMPERATURE}
    max-context-chunks = 8
    max-context-chunks = ${?KONTEXT_LLM_MAX_CONTEXT_CHUNKS}
  }
  database {
    url = "jdbc:postgresql://localhost:5432/kontext"
    url = ${?KONTEXT_DB_URL}
    user = "kontext"
    user = ${?KONTEXT_DB_USER}
    password = ""
    password = ${?KONTEXT_DB_PASSWORD}
  }
  server {
    port = 8080
    port = ${?PORT}
  }
}
