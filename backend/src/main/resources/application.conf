kontext {
  security {
    secret-encryption-key = ""
    secret-encryption-key = ${?KONTEXT_SECRET_ENCRYPTION_KEY}
  }
  atlassian {
    flavor = "cloud"
    flavor = ${?KONTEXT_ATLASSIAN_FLAVOR}
    jira {
      base-url = ""
      base-url = ${?KONTEXT_JIRA_URL}
      projects = ["DEMO"]
      projects = ${?KONTEXT_JIRA_PROJECTS}
      jql-extra = ""
      jql-extra = ${?KONTEXT_JIRA_JQL_EXTRA}
    }
    confluence {
      base-url = ""
      base-url = ${?KONTEXT_CONFLUENCE_URL}
      spaces = ["DEMO"]
      spaces = ${?KONTEXT_CONFLUENCE_SPACES}
    }
    auth {
      email = ""
      email = ${?KONTEXT_ATLASSIAN_EMAIL}
      token = ""
      token = ${?KONTEXT_ATLASSIAN_TOKEN}
    }
    max-concurrency = 4
    max-concurrency = ${?KONTEXT_ATLASSIAN_MAX_CONCURRENCY}
    sync-interval-seconds = 86400
    sync-interval-seconds = ${?KONTEXT_ATLASSIAN_SYNC_INTERVAL_SECONDS}
  }
  llm {
    base-url = "http://localhost:1234/v1"
    base-url = ${?KONTEXT_LLM_BASE_URL}
    api-key = ""
    api-key = ${?KONTEXT_LLM_API_KEY}
    chat-model = "gemma-4"
    chat-model = ${?KONTEXT_LLM_CHAT_MODEL}
    embedding-model = "bge-m3"
    embedding-model = ${?KONTEXT_LLM_EMBEDDING_MODEL}
    embedding-dimension = 1024
    embedding-dimension = ${?KONTEXT_LLM_EMBEDDING_DIMENSION}
    temperature = 0.2
    temperature = ${?KONTEXT_LLM_TEMPERATURE}
    max-context-chunks = 8
    max-context-chunks = ${?KONTEXT_LLM_MAX_CONTEXT_CHUNKS}
  }
  database {
    url = "jdbc:postgresql://localhost:5432/kontext"
    url = ${?KONTEXT_DB_URL}
    user = "kontext"
    user = ${?KONTEXT_DB_USER}
    password = ""
    password = ${?KONTEXT_DB_PASSWORD}
  }
  server {
    port = 8080
    port = ${?PORT}
  }
  admin {
    token = ""
    token = ${?KONTEXT_ADMIN_TOKEN}
  }
  sources {
    local-files {
      directory = ""
      directory = ${?KONTEXT_FILES_DIRECTORY}
      sync-interval-seconds = 300
      sync-interval-seconds = ${?KONTEXT_FILES_SYNC_INTERVAL_SECONDS}
    }
  }
  notion {
    token = ""
    token = ${?KONTEXT_NOTION_TOKEN}
    api-version = "2026-03-11"
    api-version = ${?KONTEXT_NOTION_API_VERSION}
    sync-interval-seconds = 86400
    sync-interval-seconds = ${?KONTEXT_NOTION_SYNC_INTERVAL_SECONDS}
  }
  gitbook {
    token = ""
    token = ${?KONTEXT_GITBOOK_TOKEN}
    organization-id = ""
    organization-id = ${?KONTEXT_GITBOOK_ORGANIZATION_ID}
    spaces = []
    spaces = ${?KONTEXT_GITBOOK_SPACES}
    sync-interval-seconds = 86400
    sync-interval-seconds = ${?KONTEXT_GITBOOK_SYNC_INTERVAL_SECONDS}
  }
  github {
    token = ""
    token = ${?KONTEXT_GITHUB_TOKEN}
    repositories = []
    repositories = ${?KONTEXT_GITHUB_REPOSITORIES}
    api-base-url = "https://api.github.com"
    api-base-url = ${?KONTEXT_GITHUB_API_BASE_URL}
    sync-interval-seconds = 86400
    sync-interval-seconds = ${?KONTEXT_GITHUB_SYNC_INTERVAL_SECONDS}
  }
  gitlab {
    token = ""
    token = ${?KONTEXT_GITLAB_TOKEN}
    projects = []
    projects = ${?KONTEXT_GITLAB_PROJECTS}
    api-base-url = "https://gitlab.com/api/v4"
    api-base-url = ${?KONTEXT_GITLAB_API_BASE_URL}
    sync-interval-seconds = 86400
    sync-interval-seconds = ${?KONTEXT_GITLAB_SYNC_INTERVAL_SECONDS}
  }
  linear {
    api-key = ""
    api-key = ${?KONTEXT_LINEAR_API_KEY}
    api-base-url = "https://api.linear.app/graphql"
    api-base-url = ${?KONTEXT_LINEAR_API_BASE_URL}
    sync-interval-seconds = 86400
    sync-interval-seconds = ${?KONTEXT_LINEAR_SYNC_INTERVAL_SECONDS}
  }
  zendesk {
    base-url = ""
    base-url = ${?KONTEXT_ZENDESK_BASE_URL}
    email = ""
    email = ${?KONTEXT_ZENDESK_EMAIL}
    api-token = ""
    api-token = ${?KONTEXT_ZENDESK_API_TOKEN}
    sync-interval-seconds = 86400
    sync-interval-seconds = ${?KONTEXT_ZENDESK_SYNC_INTERVAL_SECONDS}
  }
  intercom {
    access-token = ""
    access-token = ${?KONTEXT_INTERCOM_ACCESS_TOKEN}
    api-base-url = "https://api.intercom.io"
    api-base-url = ${?KONTEXT_INTERCOM_API_BASE_URL}
    api-version = "2.17"
    api-version = ${?KONTEXT_INTERCOM_API_VERSION}
    sync-interval-seconds = 86400
    sync-interval-seconds = ${?KONTEXT_INTERCOM_SYNC_INTERVAL_SECONDS}
  }
  freshdesk {
    base-url = ""
    base-url = ${?KONTEXT_FRESHDESK_BASE_URL}
    api-key = ""
    api-key = ${?KONTEXT_FRESHDESK_API_KEY}
    sync-interval-seconds = 86400
    sync-interval-seconds = ${?KONTEXT_FRESHDESK_SYNC_INTERVAL_SECONDS}
  }
  backstage {
    base-url = ""
    base-url = ${?KONTEXT_BACKSTAGE_BASE_URL}
    token = ""
    token = ${?KONTEXT_BACKSTAGE_TOKEN}
    namespaces = []
    namespaces = ${?KONTEXT_BACKSTAGE_NAMESPACES}
    techdocs-enabled = false
    techdocs-enabled = ${?KONTEXT_BACKSTAGE_TECHDOCS_ENABLED}
    sync-interval-seconds = 86400
    sync-interval-seconds = ${?KONTEXT_BACKSTAGE_SYNC_INTERVAL_SECONDS}
  }
}
