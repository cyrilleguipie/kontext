build:
  maxIssues: 0
  excludeCorrectable: false

naming:
  FunctionNaming:
    active: true
    functionPattern: '^[a-zA-Z][a-zA-Z0-9]*$'

complexity:
  TooManyFunctions:
    active: false
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
