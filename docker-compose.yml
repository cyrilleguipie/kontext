services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kontext
      POSTGRES_USER: kontext
      POSTGRES_PASSWORD: ${KONTEXT_DB_PASSWORD:?Set KONTEXT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontext -d kontext"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      KONTEXT_DB_URL: jdbc:postgresql://db:5432/kontext
      KONTEXT_DB_USER: kontext
      KONTEXT_DB_PASSWORD: ${KONTEXT_DB_PASSWORD:?Set KONTEXT_DB_PASSWORD in .env}
      KONTEXT_LLM_BASE_URL: ${KONTEXT_LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      KONTEXT_LLM_API_KEY: ${KONTEXT_LLM_API_KEY:-}
      KONTEXT_LLM_CHAT_MODEL: ${KONTEXT_LLM_CHAT_MODEL:-gemma-4}
      KONTEXT_LLM_EMBEDDING_MODEL: ${KONTEXT_LLM_EMBEDDING_MODEL:-bge-m3}
      KONTEXT_LLM_EMBEDDING_DIMENSION: ${KONTEXT_LLM_EMBEDDING_DIMENSION:-1024}
      KONTEXT_LLM_TEMPERATURE: ${KONTEXT_LLM_TEMPERATURE:-0.2}
      KONTEXT_LLM_MAX_CONTEXT_CHUNKS: ${KONTEXT_LLM_MAX_CONTEXT_CHUNKS:-8}
      KONTEXT_ADMIN_TOKEN: ${KONTEXT_ADMIN_TOKEN:-}
      KONTEXT_FILES_DIRECTORY: ${KONTEXT_FILES_DIRECTORY:-/knowledge}
      KONTEXT_FILES_SYNC_INTERVAL_SECONDS: ${KONTEXT_FILES_SYNC_INTERVAL_SECONDS:-300}
      KONTEXT_ATLASSIAN_FLAVOR: ${KONTEXT_ATLASSIAN_FLAVOR:-cloud}
      KONTEXT_JIRA_URL: ${KONTEXT_JIRA_URL:-}
      KONTEXT_JIRA_PROJECTS: ${KONTEXT_JIRA_PROJECTS:-}
      KONTEXT_JIRA_JQL_EXTRA: ${KONTEXT_JIRA_JQL_EXTRA:-}
      KONTEXT_CONFLUENCE_URL: ${KONTEXT_CONFLUENCE_URL:-}
      KONTEXT_CONFLUENCE_SPACES: ${KONTEXT_CONFLUENCE_SPACES:-}
      KONTEXT_ATLASSIAN_EMAIL: ${KONTEXT_ATLASSIAN_EMAIL:-}
      KONTEXT_ATLASSIAN_TOKEN: ${KONTEXT_ATLASSIAN_TOKEN:-}
      KONTEXT_ATLASSIAN_MAX_CONCURRENCY: ${KONTEXT_ATLASSIAN_MAX_CONCURRENCY:-4}
      KONTEXT_ATLASSIAN_SYNC_INTERVAL_SECONDS: ${KONTEXT_ATLASSIAN_SYNC_INTERVAL_SECONDS:-86400}
      KONTEXT_NOTION_TOKEN: ${KONTEXT_NOTION_TOKEN:-}
      KONTEXT_NOTION_API_VERSION: ${KONTEXT_NOTION_API_VERSION:-2026-03-11}
      KONTEXT_NOTION_SYNC_INTERVAL_SECONDS: ${KONTEXT_NOTION_SYNC_INTERVAL_SECONDS:-86400}
      KONTEXT_GITBOOK_TOKEN: ${KONTEXT_GITBOOK_TOKEN:-}
      KONTEXT_GITBOOK_ORGANIZATION_ID: ${KONTEXT_GITBOOK_ORGANIZATION_ID:-}
      KONTEXT_GITBOOK_SPACES: ${KONTEXT_GITBOOK_SPACES:-}
      KONTEXT_GITBOOK_SYNC_INTERVAL_SECONDS: ${KONTEXT_GITBOOK_SYNC_INTERVAL_SECONDS:-86400}
      KONTEXT_GITHUB_TOKEN: ${KONTEXT_GITHUB_TOKEN:-}
      KONTEXT_GITHUB_REPOSITORIES: ${KONTEXT_GITHUB_REPOSITORIES:-}
      KONTEXT_GITHUB_API_BASE_URL: ${KONTEXT_GITHUB_API_BASE_URL:-https://api.github.com}
      KONTEXT_GITHUB_SYNC_INTERVAL_SECONDS: ${KONTEXT_GITHUB_SYNC_INTERVAL_SECONDS:-86400}
      KONTEXT_GITLAB_TOKEN: ${KONTEXT_GITLAB_TOKEN:-}
      KONTEXT_GITLAB_PROJECTS: ${KONTEXT_GITLAB_PROJECTS:-}
      KONTEXT_GITLAB_API_BASE_URL: ${KONTEXT_GITLAB_API_BASE_URL:-https://gitlab.com/api/v4}
      KONTEXT_GITLAB_SYNC_INTERVAL_SECONDS: ${KONTEXT_GITLAB_SYNC_INTERVAL_SECONDS:-86400}
      KONTEXT_LINEAR_API_KEY: ${KONTEXT_LINEAR_API_KEY:-}
      KONTEXT_LINEAR_API_BASE_URL: ${KONTEXT_LINEAR_API_BASE_URL:-https://api.linear.app/graphql}
      KONTEXT_LINEAR_SYNC_INTERVAL_SECONDS: ${KONTEXT_LINEAR_SYNC_INTERVAL_SECONDS:-86400}
      KONTEXT_ZENDESK_BASE_URL: ${KONTEXT_ZENDESK_BASE_URL:-}
      KONTEXT_ZENDESK_EMAIL: ${KONTEXT_ZENDESK_EMAIL:-}
      KONTEXT_ZENDESK_API_TOKEN: ${KONTEXT_ZENDESK_API_TOKEN:-}
      KONTEXT_ZENDESK_SYNC_INTERVAL_SECONDS: ${KONTEXT_ZENDESK_SYNC_INTERVAL_SECONDS:-86400}
      KONTEXT_INTERCOM_ACCESS_TOKEN: ${KONTEXT_INTERCOM_ACCESS_TOKEN:-}
      KONTEXT_INTERCOM_API_BASE_URL: ${KONTEXT_INTERCOM_API_BASE_URL:-https://api.intercom.io}
      KONTEXT_INTERCOM_API_VERSION: ${KONTEXT_INTERCOM_API_VERSION:-2.17}
      KONTEXT_INTERCOM_SYNC_INTERVAL_SECONDS: ${KONTEXT_INTERCOM_SYNC_INTERVAL_SECONDS:-86400}
      KONTEXT_FRESHDESK_BASE_URL: ${KONTEXT_FRESHDESK_BASE_URL:-}
      KONTEXT_FRESHDESK_API_KEY: ${KONTEXT_FRESHDESK_API_KEY:-}
      KONTEXT_FRESHDESK_SYNC_INTERVAL_SECONDS: ${KONTEXT_FRESHDESK_SYNC_INTERVAL_SECONDS:-86400}
      KONTEXT_BACKSTAGE_BASE_URL: ${KONTEXT_BACKSTAGE_BASE_URL:-}
      KONTEXT_BACKSTAGE_TOKEN: ${KONTEXT_BACKSTAGE_TOKEN:-}
      KONTEXT_BACKSTAGE_NAMESPACES: ${KONTEXT_BACKSTAGE_NAMESPACES:-}
      KONTEXT_BACKSTAGE_TECHDOCS_ENABLED: ${KONTEXT_BACKSTAGE_TECHDOCS_ENABLED:-false}
      KONTEXT_BACKSTAGE_SYNC_INTERVAL_SECONDS: ${KONTEXT_BACKSTAGE_SYNC_INTERVAL_SECONDS:-86400}
    volumes:
      - ./knowledge:${KONTEXT_FILES_DIRECTORY:-/knowledge}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  ui:
    build:
      context: ./ui
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

volumes:
  pgdata:
